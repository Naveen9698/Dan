<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typography System</title>

<style>
:root {
  --h1-clamp: clamp(36px, 4vw, 48px);
  --h2-clamp: clamp(30px, 3.5vw, 40px);
  --h3-clamp: clamp(24px, 3vw, 32px);
  --h4-clamp: clamp(22px, 2.5vw, 24px);
}

body {
  font-family: system-ui;
  background: #f5f5f5;
  padding: 40px;
}

/* ================= TABLE ================= */
.system * { margin: 0; }

.table {
  background:#fff;
  padding:20px;
  border-radius:12px;
  border:1px solid #ddd;
}

.header,.row {
  display:grid;
  grid-template-columns:120px 1fr 1fr 1fr 1fr 1fr;
  gap:12px;
  padding:8px 0;
}

.header {
  font-weight:bold;
  border-bottom:1px solid #ddd;
}

.sample {
  display:flex;
  flex-direction:column;
  gap:4px;
}

.meta {
  font-size:11px;
  color:#666;
}

.clamp {
  background:#fafafa;
  border-left:3px solid #999;
  padding-left:8px;
}

.controls {
  margin-bottom: 20px;
  display: flex;
  gap: 20px;
  align-items: center;
}

input {
  width: 60px;
}

/* ================= REAL USAGE ================= */

.real-usage {
  margin-top: 80px;
}

.usage-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
}

#desktopCard {
  grid-column: 1 / -1; /* Row 1 → full width */
}

#tabletCard {
  grid-column: span 2; /* takes 2 columns */
}

#mobileCard {
  grid-column: span 1; /* takes 1 column */
}

.usage-card {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 20px;
}

.usage-title {
  font-size: 14px;
  margin-bottom: 10px;
  color: #666;
}
</style>
</head>

<body>

<h1>Typography System – Dynamic</h1>

<div class="controls">
  <div>
    Base Unit (n):
    <input type="number" id="baseInput" value="16"> px
  </div>

  <div>
    Desktop:
    <input type="number" id="desktopScale" value="1" step="0.1">
  </div>

  <div>
    Tablet:
    <input type="number" id="tabletScale" value="0.9" step="0.1">
  </div>

  <div>
    Mobile:
    <input type="number" id="mobileScale" value="0.8" step="0.1">
  </div>
</div>

<!-- ================= TABLE ================= -->
<div class="table">
<div class="header">
<div>Element</div>
<div>Native</div>
<div>Desktop</div>
<div>Tablet</div>
<div>Mobile</div>
<div>Clamp</div>
</div>

<div id="table"></div>
</div>

<!-- ================= REAL USAGE ================= -->
<div class="real-usage">
<h2>Real Usage</h2>

<div class="usage-grid">

<div class="usage-card" id="desktopCard">
<div class="usage-title">Desktop @media (min-width: 1024px) and (max-width: 1440px)</div>
<div class="content"></div>
</div>

<div class="usage-card" id="tabletCard">
<div class="usage-title">Tablet @media (min-width: 768px) and (max-width: 1023px)</div>
<div class="content"></div>
</div>

<div class="usage-card" id="mobileCard">
<div class="usage-title">Mobile @media (max-width: 767px)</div>
<div class="content"></div>
</div>

</div>
</div>

<script>
const types = [
  {name:"h1", mult:3, weight:700, line:1.2, letter:-0.5},
  {name:"h2", mult:2.5, weight:700, line:1.2, letter:-0.4},
  {name:"h3", mult:2, weight:600, line:1.3, letter:-0.3},
  {name:"h4", mult:1.5, weight:600, line:1.4, letter:-0.2},
  {name:"h5", mult:1.25, weight:500, line:1.4, letter:-0.1},
  {name:"h6", mult:1.125, weight:500, line:1.5, letter:0},
  {name:"p", mult:1, weight:400, line:1.6, letter:0},
];

const baseInput = document.getElementById("baseInput");
const dInput = document.getElementById("desktopScale");
const tInput = document.getElementById("tabletScale");
const mInput = document.getElementById("mobileScale");

function content(tag){
  return `<${tag}>${tag}</${tag}>`;
}

/* ===== Native values ===== */
function getNativeMeta(tag){
  const el = document.createElement(tag);
  el.textContent = tag;
  el.style.position = "absolute";
  el.style.visibility = "hidden";

  document.body.appendChild(el);

  const style = getComputedStyle(el);

  const size = style.fontSize;
  const weight = style.fontWeight;
  const line = style.lineHeight;
  const letter = style.letterSpacing;

  document.body.removeChild(el);

  return `${size} / ${weight} / ${line} / ${letter}`;
}

/* ===== Clamp fix ===== */
function getClampSize(varName){
  const rootStyles = getComputedStyle(document.documentElement);
  const clampValue = rootStyles.getPropertyValue(varName).trim();

  const temp = document.createElement("div");
  temp.style.fontSize = clampValue;
  temp.style.position = "absolute";
  temp.style.visibility = "hidden";

  document.body.appendChild(temp);

  const size = getComputedStyle(temp).fontSize;

  document.body.removeChild(temp);

  return size;
}

/* ===== TABLE ===== */
function renderTable(base, d, t, m){
  const el = document.getElementById("table");
  el.innerHTML = "";

  types.forEach(tk=>{
    const row = document.createElement("div");
    row.className = "row";

    function cell(scale){
      const size = Math.round(base * tk.mult * scale);

      return `
      <div class="sample system" style="
        font-size:${size}px;
        font-weight:${tk.weight};
        line-height:${tk.line};
        letter-spacing:${tk.letter}px;
      ">
        ${content(tk.name)}
        <div class="meta">
          ${size}px / ${tk.weight} / ${tk.line} / ${tk.letter}px
        </div>
      </div>`;
    }

    function clampCell(){
      if(!["h1","h2","h3","h4"].includes(tk.name)) return "<div>-</div>";

      const size = getClampSize(`--${tk.name}-clamp`);

      return `
      <div class="sample system clamp" style="
        font-size:var(--${tk.name}-clamp);
        font-weight:${tk.weight};
        line-height:${tk.line};
        letter-spacing:${tk.letter}px;
      ">
        ${content(tk.name)}
        <div class="meta">
          ${size} / ${tk.weight} / ${tk.line} / ${tk.letter}px
        </div>
      </div>`;
    }

    const nativeMeta = getNativeMeta(tk.name);

    row.innerHTML = `
      <div>${tk.name}</div>

      <div class="sample">
        ${content(tk.name)}
        <div class="meta">${nativeMeta}</div>
      </div>

      ${cell(d)}
      ${cell(t)}
      ${cell(m)}

      ${clampCell()}
    `;

    el.appendChild(row);
  });
}

/* ===== REAL USAGE (HERO + CARD) ===== */
function renderUsage(id, scale, base){
  const el = document.querySelector(`#${id} .content`);

  function style(tag){
    const tk = types.find(t=>t.name === tag);
    const size = Math.round(base * tk.mult * scale);
    return `
      font-size:${size}px;
      font-weight:${tk.weight};
      line-height:${tk.line};
      letter-spacing:${tk.letter}px;
    `;
  }

  el.innerHTML = `

    <!-- HERO (CENTER ALIGN) -->
    <section style="
      text-align:center;
      margin-bottom:24px;
      padding-bottom:16px;
      border-bottom:1px solid #eee;
    ">
      <h5 style="${style("h5")}; opacity:.6; margin:0;">
        PRODUCT TAGLINE
      </h5>

      <h1 style="${style("h1")}; margin:6px 0;">
        Build Better Interfaces
      </h1>

      <p style="${style("p")}; max-width:500px; margin:0 auto; opacity:.8;">
        A clean typographic system helps create hierarchy, clarity and balance across your UI.
      </p>
    </section>


    <!-- CONTENT (LEFT ALIGN) -->
    <section style="margin-bottom:24px;">
      <h2 style="${style("h2")}; margin-bottom:6px;">
        Section Heading
      </h2>

      <h3 style="${style("h3")}; margin:6px 0; color:#666;">
        Supporting subheading
      </h3>

      <p style="${style("p")}; margin:0; opacity:.85;">
        This is a real paragraph block. It shows how body text behaves relative to headings in a layout. Spacing and readability matter more than raw size values.
      </p>
    </section>


    <!-- CARD (UI COMPONENT) -->
    <section style="
      border:1px solid #ddd;
      border-radius:10px;
      padding:16px;
      display:flex;
      flex-direction:column;
      gap:8px;
    ">
      <h4 style="${style("h4")}; margin:0;">
        Card Title
      </h4>

      <h6 style="${style("h6")}; margin:0; opacity:.6;">
        Card subtitle
      </h6>

      <p style="${style("p")}; margin:0; opacity:.85;">
        Cards are one of the most common UI patterns. Typography inside them must maintain hierarchy while fitting within tighter space constraints.
      </p>

      <div style="
        display:flex;
        gap:8px;
        margin-top:8px;
      ">
        <button style="
          padding:6px 10px;
          border-radius:6px;
          border:1px solid #ccc;
          background:#fff;
          font-size:12px;
        ">Cancel</button>

        <button style="
          padding:6px 10px;
          border-radius:6px;
          border:none;
          background:#111;
          color:#fff;
          font-size:12px;
        ">Action</button>
      </div>
    </section>

  `;
}

/* ===== MASTER ===== */
function render(){
  const base = parseFloat(baseInput.value) || 16;
  const d = parseFloat(dInput.value) || 1;
  const t = parseFloat(tInput.value) || 0.9;
  const m = parseFloat(mInput.value) || 0.8;

  renderTable(base, d, t, m);

  renderUsage("desktopCard", d, base);
  renderUsage("tabletCard", t, base);
  renderUsage("mobileCard", m, base);
}

[baseInput, dInput, tInput, mInput].forEach(i=>{
  i.addEventListener("input", render);
});

window.addEventListener("resize", render);

render();
</script>

</body>

</html>
