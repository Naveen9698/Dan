<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Active Demo</title>

<style>
  body {
    margin: 0;
    font-family: system-ui;
    display: flex;
  }

  aside {
    width: 240px;
    height: 100vh;
    overflow-y: auto;
    position: sticky;
    top: 0;
    background: #fff;
    border-right: 1px solid #ddd;
    padding: 16px;
  }

  [data-ut="guide-nav"] a {
    display: block;
    padding: 8px 12px;
    margin-bottom: 6px;
    text-decoration: none;
    color: #444;
    border-radius: 6px;
  }

  [data-ut="guide-nav"] a.active {
    background: #4f46e5;
    color: white;
    font-weight: 600;
  }

  main {
    flex: 1;
    padding: 40px;
  }

  section {
    height: 700px;
    border-bottom: 1px solid #eee;
    padding-top: 40px;
  }
</style>
</head>

<body>

<!-- ✅ SIDEBAR -->
<aside data-ut="guide-nav">
  <h3>System Guide</h3>

  <a href="#base" class="active">Base</a>
  <a href="#color">Color</a>
  <a href="#spacing">Spacing</a>
  <a href="#typography">Typography</a>

</aside>

<!-- ✅ CONTENT -->
<main>

  <section id="base">
    <h2>Base</h2>
    <p>Content...</p>
  </section>

  <section id="color">
    <h2>Color</h2>
    <p>Content...</p>
  </section>

  <section id="spacing">
    <h2>Spacing</h2>
    <p>Content...</p>
  </section>

  <section id="typography">
    <h2>Typography</h2>
    <p>Content...</p>
  </section>

</main>

<script>
document.querySelectorAll('[data-ut="guide-nav"]').forEach(scope => {

  const items = scope.querySelectorAll(':scope a');

  const sections = Array.from(items).map(item =>
    document.querySelector(item.getAttribute('href'))
  );

  function onScroll() {

    const scrollPos = window.scrollY + 120;
    let activeIndex = 0;

    sections.forEach((section, index) => {
      if (section && scrollPos >= section.offsetTop) {
        activeIndex = index;
      }
    });

    items.forEach(i => i.classList.remove('active'));
    if (items[activeIndex]) {
      items[activeIndex].classList.add('active');
    }
  }

  window.addEventListener('scroll', onScroll);
  onScroll();

  items.forEach(item => {
    item.addEventListener('click', e => {

      e.preventDefault();

      const target = document.querySelector(item.getAttribute('href'));
      if (!target) return;

      target.scrollIntoView({
        behavior: 'smooth'
      });

    });
  });

});
</script>

</body>
</html>
