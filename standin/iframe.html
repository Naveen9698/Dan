<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            display: flex;
            gap: 20px;
            background: #f0f0f0;
            padding: 20px;
            zoom: 0.5;
        }


        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
            background: white;
        }

        .device {
            border: 1px solid #ccc;
            border-radius: 20px;
            background: #000;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 5500px;
        }

        .device-label {
            background: #2b6d7d;
            color: #fff;
            text-align: center;
            font-weight: 600;
            font-size: 30px;
            font-family: sans-serif;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .desktop {
            width: 1439px;
        }

        .tablet {
            width: 991px;
        }

        .mobile-horizontal {
            width: 765px;
        }

        .mobile-vertical {
            width: 478px;
        }
    </style>
</head>

<body>

    <div class="device desktop">
        <div class="device-label">Desktop (1439px)</div>
        <iframe scrolling="no" src="https://www.evonsys.com/dump"></iframe>
    </div>

    <div class="device tablet">
        <div class="device-label">Tablet (991px)</div>
        <iframe scrolling="no" src="https://www.evonsys.com/dump"></iframe>
    </div>

    <div class="device mobile-horizontal">
        <div class="device-label">Mobile (765px)</div>
        <iframe scrolling="no" src="https://www.evonsys.com/dump"></iframe>
    </div>

    <div class="device mobile-vertical">
        <div class="device-label">Mobile (478px)</div>
        <iframe scrolling="no" src="https://www.evonsys.com/dump"></iframe>
    </div>


</body>

</html>
