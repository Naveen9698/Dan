<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PX Spacing + REM Typography Utilities</title>

  <style>
    /* =====================================================
   ROOT TYPOGRAPHY SCALE (REM)
   ===================================================== */

    html {
      font-size: 16px;
      /* Desktop */
    }

    @media (max-width: 768px) {
      html {
        font-size: 15px;
        /* Tablet */
      }
    }

    @media (max-width: 480px) {
      html {
        font-size: 14px;
        /* Mobile */
      }
    }

    /* =====================================================
   SPACING TOKENS (PX – DESIGN DRIVEN)
   ===================================================== */

    :root {
      /* Desktop */
      --space-xxs: 8px;
      --space-xs: 16px;
      --space-sm: 24px;
      --space-md: 32px;
      --space-lg: 48px;
      --space-xl: 64px;
      --space-xxl: 96px;
    }

    @media (max-width: 768px) {
      :root {
        /* Tablet */
        --space-xxs: 6px;
        --space-xs: 12px;
        --space-sm: 18px;
        --space-md: 24px;
        --space-lg: 36px;
        --space-xl: 48px;
        --space-xxl: 72px;
      }
    }

    @media (max-width: 480px) {
      :root {
        /* Mobile */
        --space-xxs: 4px;
        --space-xs: 8px;
        --space-sm: 12px;
        --space-md: 16px;
        --space-lg: 24px;
        --space-xl: 32px;
        --space-xxl: 48px;
      }
    }

    /* =====================================================
   PADDING UTILITIES
   ===================================================== */

    .p-xxs {
      padding: var(--space-xxs);
    }

    .p-xs {
      padding: var(--space-xs);
    }

    .p-sm {
      padding: var(--space-sm);
    }

    .p-md {
      padding: var(--space-md);
    }

    .p-lg {
      padding: var(--space-lg);
    }

    .p-xl {
      padding: var(--space-xl);
    }

    .p-xxl {
      padding: var(--space-xxl);
    }

    .pt-xxs {
      padding-top: var(--space-xxs);
    }

    .pt-xs {
      padding-top: var(--space-xs);
    }

    .pt-sm {
      padding-top: var(--space-sm);
    }

    .pt-md {
      padding-top: var(--space-md);
    }

    .pt-lg {
      padding-top: var(--space-lg);
    }

    .pt-xl {
      padding-top: var(--space-xl);
    }

    .pt-xxl {
      padding-top: var(--space-xxl);
    }

    .pr-xxs {
      padding-right: var(--space-xxs);
    }

    .pr-xs {
      padding-right: var(--space-xs);
    }

    .pr-sm {
      padding-right: var(--space-sm);
    }

    .pr-md {
      padding-right: var(--space-md);
    }

    .pr-lg {
      padding-right: var(--space-lg);
    }

    .pr-xl {
      padding-right: var(--space-xl);
    }

    .pr-xxl {
      padding-right: var(--space-xxl);
    }

    .pb-xxs {
      padding-bottom: var(--space-xxs);
    }

    .pb-xs {
      padding-bottom: var(--space-xs);
    }

    .pb-sm {
      padding-bottom: var(--space-sm);
    }

    .pb-md {
      padding-bottom: var(--space-md);
    }

    .pb-lg {
      padding-bottom: var(--space-lg);
    }

    .pb-xl {
      padding-bottom: var(--space-xl);
    }

    .pb-xxl {
      padding-bottom: var(--space-xxl);
    }

    .pl-xxs {
      padding-left: var(--space-xxs);
    }

    .pl-xs {
      padding-left: var(--space-xs);
    }

    .pl-sm {
      padding-left: var(--space-sm);
    }

    .pl-md {
      padding-left: var(--space-md);
    }

    .pl-lg {
      padding-left: var(--space-lg);
    }

    .pl-xl {
      padding-left: var(--space-xl);
    }

    .pl-xxl {
      padding-left: var(--space-xxl);
    }

    /* =====================================================
   MARGIN UTILITIES
   ===================================================== */

    .m-xxs {
      margin: var(--space-xxs);
    }

    .m-xs {
      margin: var(--space-xs);
    }

    .m-sm {
      margin: var(--space-sm);
    }

    .m-md {
      margin: var(--space-md);
    }

    .m-lg {
      margin: var(--space-lg);
    }

    .m-xl {

    }

    }

    .mt-xxs {

    }

    .mt-xs {

    }

    .mr-xxs {

    }

    .mr-xs {

    }

    .mr-sm {
      margin-right: var(--space-sm);
    }

    .mr-md {
      margin-right: var(--space-md);
    }

    .mr-lg {
      margin-right: var(--space-lg);
    }

    .mr-xl {
      margin-right: var(--space-xl);
    }

    .mr-xxl {
      margin-right: var(--space-xxl);
    }

    .mb-xxs {
      margin-bottom: var(--space-xxs);
    }

    .mb-xs {

    .mb-sm {

    .mb-xl {

    }

    .mb-xxl {
      margin-bottom: var(--space-xxl);
    }

    .ml-xxs {

    }

    .ml-xs {
      margin-left: var(--space-xs);
    }

    .ml-sm {

    }

    .ml-md {

    }

    .ml-lg {

    }

    .ml-xl {
      margin-left: var(--space-xl);
    }

    .ml-xxl {
      margin-left: var(--space-xxl);
    }

    /* =====================================================
   TYPOGRAPHY SIZE UTILITIES (REM)
   ===================================================== */

    .fs-xxs {
      font-size: 0.875rem;
    }

    /* ~14px */
    .fs-xs {
      font-size: 1rem;
    }

    /* ~16px */
    .fs-sm {
      font-size: 1.5rem;
    }

    /* ~24px */
    .fs-md {
      font-size: 2rem;
    }

    /* ~32px */
    .fs-lg {
      font-size: 3rem;
    }

    /* ~48px */
    .fs-xl {
      font-size: 4rem;
    }

    /* ~64px */
    .fs-xxl {
      font-size: 5rem;
    }

    /* ~80px */

    /* Tablet typography adjustment */
    @media (max-width: 768px) {
      .fs-sm {
        font-size: 1.375rem;
      }

      .fs-md {
        font-size: 1.75rem;
      }

      .fs-lg {
        font-size: 2.5rem;
      }

      .fs-xl {
        font-size: 3.5rem;
      }

      .fs-xxl {
        font-size: 4rem;
      }
    }

    /* Mobile typography adjustment */
    @media (max-width: 480px) {
      .fs-sm {
        font-size: 1.125rem;
      }

      .fs-md {
        font-size: 1.375rem;
      }

      .fs-lg {
        font-size: 1.75rem;
      }

      .fs-xl {
        font-size: 2.25rem;
      }

      .fs-xxl {
        font-size: 3rem;
      }
    }

    /* =====================================================
   STACK (VERTICAL RHYTHM)
   ===================================================== */

    .stack>*+* {
      margin-top: var(--space-sm);
    }
  </style>
</head>

<body>

  <article class="card p-lg stack">
    <span class="tag p-xxs fs-xxs">Utility‑First Tokens</span>

    <div class="fs-xl">Extra Large Title (fs-xl)</div>
    <div class="fs-lg">Large Title (fs-lg)</div>
    <div class="fs-md">Medium Title (fs-md)</div>
    <div class="fs-sm">Small Title (fs-sm)</div>
    <div class="fs-xs">Body Text (fs-xs)</div>
    <div class="fs-xxs">Fine Print (fs-xxs)</div>

    <div class="fs-xs">
      Font size is controlled entirely by classes, while spacing is controlled
      separately via pixel-based tokens.
    </div>
  </article>

</body>

</html>
